<title id="title">Downstream Radar - source release 0.1.0</title>
<desc id="desc">Your tests pass. What about your consumers? Baseline and candidate runs. Real consumer test evidence. Clear inconclusive results. Reports cover the declared consumer set, not the whole ecosystem.</desc>
